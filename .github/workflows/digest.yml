name: digest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Тип поста"
        type: choice
        options: [single, gallery]
        default: single
  schedule:
    - cron: "0 11 * * *"
    - cron: "20 11 * * *"
    - cron: "40 11 * * *"
    - cron: "0 12 * * *"
    - cron: "0 15 * * *"
    - cron: "20 15 * * *"
    - cron: "40 15 * * *"
    - cron: "0 16 * * *"
    - cron: "30 18 * * *"
    - cron: "50 18 * * *"
    - cron: "10 19 * * *"
    - cron: "30 19 * * *"

permissions:
  contents: write
  models: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests pillow
      - name: Run
        env:
          EVENT_INPUT_MODE: ${{ github.event.inputs.mode }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@nahodki_do_zp"
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
        run: python digest.py
