name: digest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Тип поста"
        type: choice
        options: [single, gallery]
        default: single
  schedule:
    - cron: "25 5 * * *"
    - cron: "45 5 * * *"
    - cron: "5 6 * * *"
    - cron: "25 6 * * *"
    - cron: "55 9 * * *"
    - cron: "15 10 * * *"
    - cron: "35 10 * * *"
    - cron: "55 10 * * *"
    - cron: "55 17 * * *"
    - cron: "15 18 * * *"
    - cron: "35 18 * * *"
    - cron: "55 18 * * *"

permissions:
  contents: write
  models: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests pillow
      - name: Run
        env:
          EVENT_INPUT_MODE: ${{ github.event.inputs.mode }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@nahodki_do_zp"
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
        run: python digest.py
