name: digest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Тип поста"
        type: choice
        options: [single, gallery]
        default: single
  schedule:
    - cron: "30 5 * * *"
    - cron: "50 5 * * *"
    - cron: "10 6 * * *"
    - cron: "30 6 * * *"
    - cron: "0 10 * * *"
    - cron: "20 10 * * *"
    - cron: "40 10 * * *"
    - cron: "0 11 * * *"
    - cron: "0 18 * * *"
    - cron: "20 18 * * *"
    - cron: "40 18 * * *"
    - cron: "0 19 * * *"

permissions:
  contents: write
  models: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install requests pillow
      - name: Run
        env:
          EVENT_INPUT_MODE: ${{ github.event.inputs.mode }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@nahodki_do_zp"
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
        run: python digest.py
