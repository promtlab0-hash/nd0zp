name: digest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Тип поста"
        type: choice
        options:
          - single
          - gallery
        default: single

permissions:
  contents: write
  models: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests pillow
      - name: Run
        env:
          MODE: ${{ github.event.inputs.mode }}
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@nahodki_do_zp"
        run: python digest.py
